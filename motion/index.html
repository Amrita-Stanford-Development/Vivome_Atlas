<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>VivOME: the dive</title>
    <!-- The two-minute film about VivOME, as a HyperFrames composition: the
         site's living water under twelve scenes (compositions/), with the
         time code and depth gauge on top. The storyboard it follows, with
         each scene's words and timing, is web/js/reel-frames.js; run
         scripts/prepare.mjs first (the npm scripts do), which fills build/
         and vendor/ from the repository. docs/web/motion.md explains it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vendor/site/page.css">
    <link rel="stylesheet" href="lib/film.css">
    <script src="vendor/three.min.js"></script>
    <script src="vendor/gsap.min.js"></script>
    <script src="build/facts.js"></script>
    <script src="build/count.js"></script>
    <script src="lib/slots.js"></script>
</head>
<body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="120" data-width="1920" data-height="1080">
        <canvas id="dive" width="1920" height="1080" data-layout-ignore></canvas>
        <div id="frost" data-layout-ignore><div id="grain"></div></div>

        <!-- Each scene's host lasts 1.5 s into the next (web/js/reel-frames.js,
             HANDOVER): lib/dive.js places every host where the camera sees
             its scene, so the outgoing cards are carried out of the frame
             while the next scene's are carried in. -->
        <div id="host-surface" data-composition-id="s-surface" data-composition-src="compositions/s01-surface.html" data-start="0" data-duration="9.5" data-track-index="2" data-width="1920" data-height="1080"></div>
        <div id="host-unnamed" data-composition-id="s-unnamed" data-composition-src="compositions/s02-unnamed.html" data-start="8" data-duration="11.5" data-track-index="2" data-width="1920" data-height="1080"></div>
        <div id="host-gaps" data-composition-id="s-gaps" data-composition-src="compositions/s03-gaps.html" data-start="18" data-duration="11.5" data-track-index="2" data-width="1920" data-height="1080"></div>
        <div id="host-rna" data-composition-id="s-rna" data-composition-src="compositions/s04-rna.html" data-start="28" data-duration="11.5" data-track-index="2" data-width="1920" data-height="1080"></div>
        <div id="host-vivome" data-composition-id="s-vivome" data-composition-src="compositions/s05-vivome.html" data-start="38" data-duration="13.5" data-track-index="2" data-width="1920" data-height="1080"></div>
        <div id="host-built-for-gaps" data-composition-id="s-built-for-gaps" data-composition-src="compositions/s06-built-for-gaps.html" data-start="50" data-duration="11.5" data-track-index="2" data-width="1920" data-height="1080"></div>
        <div id="host-answers" data-composition-id="s-answers" data-composition-src="compositions/s07-answers.html" data-start="60" data-duration="13.5" data-track-index="2" data-width="1920" data-height="1080"></div>
        <div id="host-second-opinion" data-composition-id="s-second-opinion" data-composition-src="compositions/s08-second-opinion.html" data-start="72" data-duration="9.5" data-track-index="2" data-width="1920" data-height="1080"></div>
        <div id="host-real-data" data-composition-id="s-real-data" data-composition-src="compositions/s09-real-data.html" data-start="80" data-duration="13.5" data-track-index="2" data-width="1920" data-height="1080"></div>
        <div id="host-methods" data-composition-id="s-methods" data-composition-src="compositions/s10-methods.html" data-start="92" data-duration="13.5" data-track-index="2" data-width="1920" data-height="1080"></div>
        <div id="host-atlas" data-composition-id="s-atlas" data-composition-src="compositions/s11-atlas.html" data-start="104" data-duration="11.5" data-track-index="2" data-width="1920" data-height="1080"></div>
        <div id="host-light" data-composition-id="s-light" data-composition-src="compositions/s12-light.html" data-start="114" data-duration="6" data-track-index="2" data-width="1920" data-height="1080"></div>

        <!-- The morphs between scenes (lib/bridges.js), over the cards. -->
        <canvas id="bridges" width="1920" height="1080" data-layout-ignore></canvas>

        <div id="hud" data-layout-ignore>
            <div id="hud-clock"><span id="hud-time">0:00</span><span id="hud-chapter">The problem</span></div>
            <div id="gauge">
                <span class="gauge-tick" style="top: 25%"></span>
                <span class="gauge-tick" style="top: 50%"></span>
                <span class="gauge-tick" style="top: 75%"></span>
                <span id="gauge-mark" style="top: 0%"></span>
            </div>
        </div>
        <div id="veil" data-layout-ignore></div>
    </div>

    <script type="module" src="lib/dive.js"></script>
    <script>
        // The film's own timeline: it opens from white light. Each scene
        // brings its own timeline (compositions/); the water and the motif
        // are drawn on every seek by lib/dive.js.
        window.__timelines = window.__timelines || {};
        const film = gsap.timeline({ paused: true });
        film.fromTo('#veil', { opacity: 1 }, { opacity: 0, duration: 1.4, ease: 'power2.out' }, 0.1);
        film.fromTo('#hud', { opacity: 0 }, { opacity: 1, duration: 1, ease: 'power1.out' }, 1.2);
        film.to('#hud', { opacity: 0, duration: 0.8, ease: 'power1.in' }, 115.2);
        film.set({}, {}, 120);
        window.__timelines.main = film;
    </script>
</body>
</html>
