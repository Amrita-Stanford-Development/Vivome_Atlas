    <div id="s-second-opinion" class="scene" data-composition-id="s-second-opinion" data-width="1920" data-height="1080">

    <script>
        (function () {
            const root = document.getElementById('s-second-opinion');
            VivomeSlots.fill(root);
            const C = VivomeCue;
            const so = window.VIVOME.secondOpinion;
            const tl = gsap.timeline({ paused: true });
            // Each current's tag with its current; the gate's note as the

            C.card(tl, root, 'second-opinion', {
