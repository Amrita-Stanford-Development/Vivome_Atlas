<template>

         the proteins measured in it: the sets differ from cell to cell
         (the PBMC240 example file, lib/scenes.js). At the close the first
         cell's column grows to full height where scene 3's matrix opens.
         Liquid glass. -->
    <style>
        #s-unnamed .words { left: 140px; top: 610px; width: 1060px; }

            position: absolute; font-size: 21px; font-weight: 500; color: var(--ink-soft); white-space: nowrap;

    <div id="s-unnamed" class="scene" data-composition-id="s-unnamed" data-width="1920" data-height="1080">

    <script>
        (function () {
            const root = document.getElementById('s-unnamed');
            VivomeSlots.fill(root);
            const C = VivomeCue;
            const tl = gsap.timeline({ paused: true });
            C.card(tl, root, 'unnamed');
            const reveal = (target, at, duration = 0.6) => tl.fromTo(target, { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration, ease: 'power2.inOut' }, at);
            // "But those cells arrive without names."
            reveal('#s-unnamed .cut', 2.0, 0.5);
            tl.fromTo(root.querySelectorAll('.tag'), { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.4, ease: 'power2.inOut', stagger: 0.12 }, 1.6);

            const show = (target, at, duration) => tl.fromTo(target, { opacity: 0 }, { opacity: 1, duration, ease: 'power1.out' }, at);
            const parts = root.querySelectorAll('.part');
            show(parts[0], C.cue('unnamed', 1), 0.6);
            // "and every lab detects a different set of proteins."
            show(parts[1], C.cue('unnamed', 2), 0.6);
            // The tags make way as the first cell's column grows.
            tl.fromTo(root.querySelectorAll('.tag'), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: 'power1.in', immediateRender: false }, C.exit('unnamed'));

            window.__timelines['s-unnamed'] = tl;
