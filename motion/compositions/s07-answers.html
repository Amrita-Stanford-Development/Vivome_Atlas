<template>
    <!-- Scene 7: honest answers. Manim draws the reference map growing from
         where scene 6 left its points, and four cells of the PBMC240
         example file landing on it, each with the widest set its types
         belong to (manim/answers.py, rendered to build/manim/answers/). As
         the voice names each rung (a cell type, its group, its lineage, or
         no answer), that cell's set narrows to its answer (the last one
         widens), the rung lights and the answer shows beside the cell
         (lib/scenes.js); the reason is shown as it is said. At the close
         the last cell's best guess splits into two strokes at the map's
         edge, where scene 8's two currents start. White cards. -->
    <style>
        #s-answers .head { left: 140px; top: 46px; padding-top: 30px; padding-bottom: 30px; }
        #s-answers .map { left: 70px; top: 232px; width: 1080px; height: 818px; padding: 0; }
        #s-answers img.layer { left: 0; top: 0; width: 1920px; height: 1080px; }
        #s-answers .ladder { left: 1180px; top: 232px; width: 600px; height: 640px; padding: 34px 36px; display: grid; gap: 14px; align-content: start; }
        #s-answers .rung { padding: 16px 22px; border-radius: 16px; background: var(--bench); opacity: 0.32; border-left: 7px solid transparent; }
        #s-answers .rung .f-label { margin: 0; color: var(--ink); font-weight: 600; font-size: 30px; }
        #s-answers .rung .f-caption { margin-top: 2px; color: var(--ink-soft); opacity: 0; }
        #s-answers .rung:nth-child(1) { border-left-color: var(--accent); }
        #s-answers .rung:nth-child(2) { border-left-color: rgba(0, 102, 163, 0.65); }
        #s-answers .rung:nth-child(3) { border-left-color: rgba(0, 102, 163, 0.35); }
        #s-answers .rung:nth-child(4) { border-left-color: rgba(29, 43, 54, 0.3); }
        #s-answers .aside { margin-top: 8px; opacity: 0; }
        #s-answers .cut { clip-path: inset(0 100% 0 0); }
    </style>
    <div id="s-answers" class="scene" data-composition-id="s-answers" data-width="1920" data-height="1080">
        <div class="map card sheet"></div>
        <div class="figure"><img id="answers-img" class="layer" alt="" data-layout-ignore></div>
        <div class="head card sheet">
            <h1 class="f-display">When unsure, it says <span class="cut">so.</span></h1>
        </div>
        <div class="ladder card sheet">
            <div class="rung"><span class="f-label">Cell type</span><span class="f-caption" data-answer="0"></span></div>
            <div class="rung"><span class="f-label">Group</span><span class="f-caption" data-answer="1"></span></div>
            <div class="rung"><span class="f-label">Lineage</span><span class="f-caption" data-answer="2"></span></div>
            <div class="rung"><span class="f-label">No answer, and the reason</span><span class="f-caption" data-answer="3"></span></div>
            <div class="aside"><span class="f-caption">Cells of the PBMC240 example file, and the answers VivOME gave them.</span></div>
        </div>
        <canvas id="answers-over" class="over" width="1920" height="1080" data-layout-ignore></canvas>
    </div>
    <script>
        (function () {
            const root = document.getElementById('s-answers');
            VivomeSlots.fill(root);
            // Each rung's example is the answer the served model gave that cell.
            for (const el of root.querySelectorAll('[data-answer]')) {
                const a = window.VIVOME.answers[Number(el.dataset.answer)];
                el.textContent = a ? a.answer : '';
            }
            const C = VivomeCue;
            const shot = window.VIVOME.answersShot;
            const tl = gsap.timeline({ paused: true });
            C.card(tl, root, 'answers');
            // "Every cell gets the most precise answer the evidence allows:"
            tl.fromTo('#s-answers .cut', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.5, ease: 'power2.inOut' }, 2.6);
            // "a cell type, its group, its lineage, or no answer,": each rung
            // lights as it is said, as its cell's set settles.
            const rungs = root.querySelectorAll('.rung');
            rungs.forEach((rung, k) => {
                tl.fromTo(rung, { opacity: 0.32 }, { opacity: 1, duration: 0.35, ease: 'power1.out' }, shot.settle[k] - 0.15);
                if (k < 3) tl.fromTo(rung.querySelector('.f-caption'), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power1.out' }, shot.settle[k]);
            });
            // "and the reason why."
            tl.fromTo(rungs[3].querySelector('.f-caption'), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power1.out' }, shot.reason);
            tl.fromTo('#s-answers .aside', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power1.out' }, 8.8);
            window.__timelines = window.__timelines || {};
            window.__timelines['s-answers'] = tl;
        })();
    </script>
</template>
